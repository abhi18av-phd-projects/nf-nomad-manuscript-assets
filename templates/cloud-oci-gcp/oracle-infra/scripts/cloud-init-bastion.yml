#cloud-config
package_upgrade: true
packages:
  - curl
  - wget
  - unzip
  - jq # Utilidad para parsear JSON
  - nfs-utils

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${publicKey}

write_files:
  - path: /home/ubuntu/bastion/docker-compose.yml
    content: |
      # frontend stack
      services:      
        caddy:
          image: caddy:2.11.1-alpine
          container_name: caddy
          restart: always
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - ./caddy_data:/data
            - ./caddy_config:/config
            - ./acme_challenges:/var/www/challenges
          deploy:
            mode: replicated
            replicas: ${caddy_instance}

  - path: /home/ubuntu/bastion/Caddyfile
    content: |
      ${domain_name} {
        handle /v1/* {
          reverse_proxy ${nomadServerIpAddress}:4646
        }
        handle {
          reverse_proxy ${nomadServerIpAddress}:8080
        }
      }

runcmd:
  # Install Docker
  - |
    sudo apt-get update
    sudo apt-get install -y ca-certificates curl
    sudo install -m 0755 -d /etc/apt/keyrings
    sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    sudo chmod a+r /etc/apt/keyrings/docker.asc
    
    echo \
    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
    $(. /etc/os-release && echo "$UBUNTU_CODENAME") stable" | \
    sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
    sudo apt-get update
    
    sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    docker run hello-world
      
    usermod -aG docker ubuntu
    cd /home/ubuntu/bastion
    docker compose up -d;
