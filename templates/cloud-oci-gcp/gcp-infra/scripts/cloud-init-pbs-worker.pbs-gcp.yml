#cloud-config
# OpenPBS worker — pbs-gcp pre-baked image variant.
# OpenPBS binaries already installed; only per-node configuration needed.
# Workers do NOT join Tailscale — internal GCP IP only.
# Template variables: ${publicKey}, ${ctrlIp}, ${ctrlHostname}, ${nodeName}
output: {all: '| tee -a /var/log/cloud-init-output.log'}
hostname: ${nodeName}

packages:
  - nfs-common
  - singularity-container

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${publicKey}

runcmd:

  # -- 0. Hostname pinning ---------------------------------------------------
  - |
    grep -q "^${ctrlIp} ${ctrlHostname}$" /etc/hosts || \
      printf '%s %s\n' "${ctrlIp}" "${ctrlHostname}" >> /etc/hosts
    grep -q "^127.0.0.1 ${nodeName}$" /etc/hosts || \
      printf '127.0.0.1 %s\n' "${nodeName}" >> /etc/hosts

  # -- 1. NFS mount ----------------------------------------------------------
  - |
    mkdir -p /shared
    grep -q "^${ctrlIp}:/shared /shared nfs" /etc/fstab || \
      echo "${ctrlIp}:/shared /shared nfs defaults,_netdev 0 0" >> /etc/fstab
    mount -a || true

  # -- 3. Configure pbs_mom (binaries already in image) ---------------------
  - |
    sed -i \
      -e 's/PBS_START_SERVER=1/PBS_START_SERVER=0/' \
      -e 's/PBS_START_SCHED=1/PBS_START_SCHED=0/' \
      -e 's/PBS_START_COMM=1/PBS_START_COMM=0/' \
      /etc/pbs.conf
    sed -i 's/PBS_START_MOM=0/PBS_START_MOM=1/' /etc/pbs.conf
    sed -i "s/PBS_SERVER=.*/PBS_SERVER=${ctrlHostname}/" /etc/pbs.conf

  # -- 4. Start pbs_mom ------------------------------------------------------
  - |
    systemctl enable pbs && systemctl start pbs
    for i in $(seq 1 30); do
      systemctl is-active --quiet pbs && break; sleep 5
    done
    systemctl is-active --quiet pbs || { journalctl -u pbs -n 80 --no-pager; exit 1; }
    echo "pbs_mom active"

  - echo "Completed"

final_message: "OpenPBS worker (pbs_mom) ready — pbs-gcp image."
