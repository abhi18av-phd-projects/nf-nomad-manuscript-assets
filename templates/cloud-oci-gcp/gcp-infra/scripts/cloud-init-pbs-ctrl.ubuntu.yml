#cloud-config
# OpenPBS controller — build-from-source mode (ubuntu image variant).
# Installs OpenPBS 23.06.06 from source, sets up pbs_server/pbs_sched/pbs_mom,
# creates queues, deploys pbsweb dashboard, and starts a Nomad client with
# nomad-driver-pbs so `abc job run` can dispatch jobs to this PBS cluster.
#
# Template variables (substituted by PbsCluster.ts / getScript()):
#   ${publicKey}             SSH public key for ubuntu user
#   ${tailscaleKey}          Tailscale auth key
#   ${tailscaleHostname}     Tailscale device hostname (e.g. abc-dev-pbs-ctrl)
#   ${ctrlHostname}          Internal VM hostname (e.g. abc-dev-pbs-ctrl)
#   ${ctrlIp}                Internal IP of this ctrl VM (e.g. 10.0.2.50)
#   ${workerHostsScript}      Shell commands to pin worker IPs in /etc/hosts
#   (qmgr create+set node …)  qmgr create node commands for each worker
#   ${nomad_server_hostname}  Nomad server MagicDNS hostname for client join
#   ${nomad_version}          Nomad binary version (e.g. 1.11.2)
#   ${pbsDriverArtifactUrl}   URL to pbs driver binary
#   ${aclEnabled}             "true" | "false"
output: {all: '| tee -a /var/log/cloud-init-output.log'}
hostname: ${ctrlHostname}

packages:
  - nfs-kernel-server
  - curl
  - wget
  - unzip
  - jq
  - python3-pip
  - python3-venv
  # OpenPBS build dependencies
  - autoconf
  - automake
  - libtool
  - make
  - gcc
  - g++
  - libssl-dev
  - libexpat1-dev
  - libedit-dev
  - libical-dev
  - libhwloc-dev
  - hwloc
  - libpq-dev
  - libsystemd-dev
  - tcl-dev
  - tk-dev
  - python3-dev
  - python3-setuptools
  - swig
  - postgresql
  - postgresql-contrib
  # X11 dev headers required by OpenPBS build on Ubuntu 24.04
  - libxt-dev
  - libxext-dev
  - libsm-dev
  - libice-dev
  - libxmu-dev
  - x11-common
  # Python 3.11 PPA tools (python3.11 installed via add-apt-repository in runcmd)
  - software-properties-common

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${publicKey}

write_files:
  # -- Nomad client config ---------------------------------------------------
  - path: /etc/nomad.d/nomad.hcl
    permissions: "0644"
    owner: root:root
    content: |
      datacenter = "gcp-nomadlab"
      data_dir   = "/opt/nomad/data"
      log_level  = "INFO"
      bind_addr  = "0.0.0.0"

      client {
        enabled    = true
        node_class = "pbs-login"
        servers    = ["${nomad_server_hostname}:4647"]

        options {
          "driver.whitelist" = "pbs,raw_exec"
        }

        host_volume "shared" {
          path      = "/shared"
          read_only = false
        }
      }

      acl {
        enabled = true
      }

      plugin_dir = "/opt/nomad/plugins"

      # Binary must be named "pbs" (Nomad matches plugin blocks by filename).
      plugin "pbs" {
        config {
          pbs_server    = "${ctrlHostname}"
          poll_interval = "10s"
          script_dir    = "/shared/nomad-scripts"
          default_queue = "debug"
        }
      }

      plugin "raw_exec" {
        config {
          enabled = true
        }
      }

  # -- Nomad systemd unit ----------------------------------------------------
  - path: /etc/systemd/system/nomad.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=HashiCorp Nomad
      Documentation=https://www.nomadproject.io/
      Requires=network-online.target
      After=network-online.target tailscaled.service

      [Service]
      # Run as ubuntu so qsub is allowed — PBS rejects root submissions by default.
      User=ubuntu
      Group=ubuntu
      # pbs-readiness-check waits up to 120 s for pbs_server to respond.
      TimeoutStartSec=180
      ExecStartPre=/usr/local/bin/pbs-readiness-check.sh
      ExecStart=/usr/local/bin/nomad agent -config=/etc/nomad.d
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

  # -- PBS readiness check for Nomad ExecStartPre ----------------------------
  - path: /usr/local/bin/pbs-readiness-check.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      deadline="$((SECONDS + 120))"
      while (( SECONDS < deadline )); do
        if qstat -B >/dev/null 2>&1; then
          echo "PBS server is ready"
          exit 0
        fi
        sleep 3
      done
      echo "PBS readiness check timed out" >&2
      journalctl -u pbs -n 60 --no-pager || true
      exit 1

  # -- pbsdash Flask app (custom, since pbsweb is not on PyPI for Ubuntu 24.04) -
  - path: /opt/pbsweb-venv/pbsdash.py
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env python3
      """Minimal PBS dashboard — wraps qstat/pbsnodes JSON output."""
      import json, subprocess, re
      from flask import Flask, jsonify, render_template_string

      app = Flask(__name__)

      HTML = """<!DOCTYPE html>
      <html><head><title>PBS Dashboard</title>
      <style>body{font-family:monospace;margin:2em;background:#1e1e1e;color:#d4d4d4}
      h2{color:#9cdcfe}table{border-collapse:collapse;width:100%}
      th{background:#333;padding:6px 12px;text-align:left}
      td{padding:4px 12px;border-bottom:1px solid #333}
      .free{color:#4ec9b0}.busy{color:#ce9178}.down{color:#f44747}
      a{color:#9cdcfe;text-decoration:none}pre{white-space:pre-wrap}</style>
      <meta http-equiv="refresh" content="15"></head><body>
      <h1>PBS Dashboard — {{ server }}</h1>
      <h2>Nodes</h2><table><tr><th>Node</th><th>State</th><th>CPUs</th><th>Jobs</th></tr>
      {% for n in nodes %}<tr>
      <td>{{ n.name }}</td>
      <td class="{{ 'free' if n.state=='free' else 'busy' if 'busy' in n.state else 'down' }}">{{ n.state }}</td>
      <td>{{ n.cpus }}</td><td>{{ n.jobs }}</td></tr>{% endfor %}</table>
      <h2>Jobs</h2><table><tr><th>ID</th><th>Name</th><th>User</th><th>Queue</th><th>State</th><th>CPUs</th><th>Walltime</th></tr>
      {% for j in jobs %}<tr>
      <td>{{ j.id }}</td><td>{{ j.name }}</td><td>{{ j.user }}</td>
      <td>{{ j.queue }}</td>
      <td class="{{ 'free' if j.state=='R' else 'busy' if j.state=='Q' else 'down' }}">{{ j.state }}</td>
      <td>{{ j.cpus }}</td><td>{{ j.walltime }}</td></tr>{% endfor %}</table>
      <h2>Queues</h2><table><tr><th>Queue</th><th>Enabled</th><th>Started</th><th>Run</th><th>Queued</th></tr>
      {% for q in queues %}<tr>
      <td>{{ q.name }}</td><td>{{ q.enabled }}</td><td>{{ q.started }}</td>
      <td>{{ q.run }}</td><td>{{ q.queued }}</td></tr>{% endfor %}</table>
      </body></html>"""

      def run(cmd):
          r = subprocess.run(cmd, capture_output=True, text=True)
          return r.stdout

      @app.route("/")
      def index():
          try:
              raw = run(["qstat","-f","-F","json"])
              data = json.loads(raw) if raw.strip() else {}
          except Exception:
              data = {}
          jobs = []
          for jid, j in data.get("Jobs", {}).items():
              res = j.get("Resource_List", {})
              jobs.append(dict(
                  id=jid, name=j.get("Job_Name",""), user=j.get("Job_Owner","").split("@")[0],
                  queue=j.get("queue",""), state=j.get("job_state",""),
                  cpus=res.get("ncpus",""), walltime=res.get("walltime","")))
          try:
              nr = run(["pbsnodes","-a","-F","json"])
              nd = json.loads(nr) if nr.strip() else {}
          except Exception:
              nd = {}
          nodes = []
          for name, n in nd.get("nodes", {}).items():
              nodes.append(dict(
                  name=name, state=n.get("state",""),
                  cpus=n.get("resources_available",{}).get("ncpus",""),
                  jobs=", ".join(n.get("jobs",[])) if n.get("jobs") else ""))
          try:
              qr = run(["qstat","-Q","-F","json"])
              qd = json.loads(qr) if qr.strip() else {}
          except Exception:
              qd = {}
          queues = []
          for qname, q in qd.get("Queue", {}).items():
              st = q.get("resources_assigned", {})
              queues.append(dict(name=qname,
                  enabled=q.get("enabled",""), started=q.get("started",""),
                  run=st.get("ncpus",0), queued=q.get("total_jobs",0)))
          server = run(["hostname","-s"]).strip()
          return render_template_string(HTML, nodes=nodes, jobs=jobs, queues=queues, server=server)

      @app.route("/api/nodes")
      def api_nodes():
          return jsonify(json.loads(run(["pbsnodes","-a","-F","json"]) or "{}"))

      @app.route("/api/jobs")
      def api_jobs():
          return jsonify(json.loads(run(["qstat","-f","-F","json"]) or "{}"))

      if __name__ == "__main__":
          app.run(host="0.0.0.0", port=5013, debug=False)

  # -- pbsweb systemd unit ---------------------------------------------------
  - path: /etc/systemd/system/pbsweb.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=PBS dashboard (Flask)
      After=network.target pbs.service

      [Service]
      Type=simple
      User=root
      ExecStart=/opt/pbsweb-venv/bin/python /opt/pbsweb-venv/pbsdash.py
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:

  # -- 0. Hostname pinning (before Tailscale joins) --------------------------
  # IMPORTANT: pin ctrlHostname to its REAL internal IP (not 127.0.0.1).
  # PBS server calls getifaddrs() to find a usable interface — if ctrlHostname
  # only resolves to loopback it will fail with "Could not find any usable IP".
  # Also pre-pin all workers so PBS server can resolve them when creating nodes.
  - |
    grep -q "^${ctrlIp} ${ctrlHostname}$" /etc/hosts || \
      printf '%s %s\n' "${ctrlIp}" "${ctrlHostname}" >> /etc/hosts
    ${workerHostsScript}

  # -- 1. NFS shared disk ----------------------------------------------------
  - |
    mkdir -p /shared
    if [ -b /dev/sdb ]; then
      if ! blkid /dev/sdb >/dev/null 2>&1; then
        mkfs.ext4 -F /dev/sdb
      fi
      mount /dev/sdb /shared || true
      grep -q '^/dev/sdb /shared ' /etc/fstab || \
        echo "/dev/sdb /shared ext4 defaults 0 2" >> /etc/fstab
    fi
    mkdir -p /shared/nomad-scripts /shared/results /shared/singularity-cache
    chmod 777 /shared/nomad-scripts /shared/results /shared/singularity-cache

  # -- 2. NFS export ---------------------------------------------------------
  - |
    grep -q '^/shared 10.0.2.0/24' /etc/exports || \
      echo "/shared 10.0.2.0/24(rw,sync,no_subtree_check,no_root_squash)" >> /etc/exports
    exportfs -ra
    systemctl enable nfs-kernel-server
    systemctl restart nfs-kernel-server

  # -- 3. Tailscale ----------------------------------------------------------
  - |
    curl -fsSL https://tailscale.com/install.sh | sh
    tailscale up --authkey="${tailscaleKey}" --hostname="${tailscaleHostname}" \
      --accept-routes --force-reauth --accept-risk=lose-ssh --reset

  # -- 4. Build OpenPBS 23.06.06 from source ---------------------------------
  # Ubuntu 24.04 ships Python 3.12 which removed eval.h from public headers.
  # Install Python 3.11 from deadsnakes PPA and use it as the build interpreter.
  - |
    export DEBIAN_FRONTEND=noninteractive
    PBS_VERSION="23.06.06"
    PBS_URL="https://github.com/openpbs/openpbs/archive/refs/tags/v${PBS_VERSION}.tar.gz"

    # Python 3.11 from deadsnakes (Python 3.12 removed eval.h from public headers)
    add-apt-repository -y ppa:deadsnakes/ppa
    apt-get update -qq
    apt-get install -y python3.11 python3.11-dev

    cd /tmp
    wget --no-verbose "$PBS_URL" -O openpbs.tar.gz || { echo "ERROR: failed to download OpenPBS $PBS_VERSION"; exit 1; }
    tar xzf openpbs.tar.gz
    cd openpbs-${PBS_VERSION}

    # Patch: Python 3.12 removed eval.h; replace with the renamed header ceval.h
    grep -rl '#include <eval.h>' src/ | xargs -r sed -i 's|#include <eval.h>|#include <ceval.h>|g'

    ./autogen.sh
    PYTHON=/usr/bin/python3.11 ./configure \
      --prefix=/usr/local \
      --with-pbs-server-home=/var/spool/pbs \
      --with-database-name=pbs \
      --with-database-user=pbs \
      --with-database-port=5432
    make -j$(nproc)
    make install

    # pbs_postinstall sets up dirs and systemd unit but does NOT create the pbs
    # OS user. Create it BEFORE calling pbs_postinstall so db_user ownership is
    # set correctly, and before pbs_habitat runs (which does su - pbs -c "cd").
    useradd -r -s /bin/bash -d /var/lib/pbs pbs
    mkdir -p /var/lib/pbs
    chown pbs:pbs /var/lib/pbs

    /usr/local/libexec/pbs_postinstall

    # Register shared library path so libpbs.so.0 is found by qstat/qsub etc.
    echo "/usr/local/lib" > /etc/ld.so.conf.d/usr-local.conf
    ldconfig

    # pbs_iff must be SUID root so non-root users can run qstat/qsub
    chmod 4755 /usr/local/sbin/pbs_iff

    echo "OpenPBS ${PBS_VERSION} installed"

  # -- 5. Configure PBS server -----------------------------------------------
  - |
    # The system postgresql package (installed for libpq-dev headers) must be
    # stopped and disabled: PBS uses its own embedded PostgreSQL cluster on the
    # same port (5432 by default), and the two conflict on the socket/port.
    systemctl stop postgresql  || true
    systemctl disable postgresql || true

    # Give the pbs OS user write access to the PostgreSQL socket directory so
    # PBS's embedded PostgreSQL can create lock files there.
    usermod -aG postgres pbs
    chgrp pbs /var/run/postgresql
    chmod g+w /var/run/postgresql

    # Enable all PBS daemons on the controller
    sed -i \
      -e 's/PBS_START_SERVER=0/PBS_START_SERVER=1/' \
      -e 's/PBS_START_MOM=0/PBS_START_MOM=1/' \
      -e 's/PBS_START_SCHED=0/PBS_START_SCHED=1/' \
      -e 's/PBS_START_COMM=0/PBS_START_COMM=1/' \
      /etc/pbs.conf

    # Server name = this host
    sed -i "s/PBS_SERVER=.*/PBS_SERVER=${ctrlHostname}/" /etc/pbs.conf

    # pbs_server (and pbs_dataservice) must agree on the data service port.
    # The build flag --with-database-port=5432 bakes 5432 into the binary; this
    # env variable ensures the runtime wrapper also uses 5432 (not the default
    # 15007 fallback in older pbs_dataservice scripts).
    grep -q '^PBS_DATA_SERVICE_PORT=' /etc/pbs.conf || \
      echo "PBS_DATA_SERVICE_PORT=5432" >> /etc/pbs.conf

    echo "${ctrlHostname}" > /var/spool/pbs/server_name
    echo "PBS_HOME=/var/spool/pbs" >> /var/spool/pbs/pbs_environment
    echo "PBS_EXEC=/usr/local"     >> /var/spool/pbs/pbs_environment

  # -- 6. Start PBS services -------------------------------------------------
  - |
    systemctl enable pbs
    systemctl start pbs
    for i in $(seq 1 30); do
      qstat -B >/dev/null 2>&1 && break
      sleep 5
    done
    qstat -B || { journalctl -u pbs -n 80 --no-pager; exit 1; }

  # -- 7. Create queues and cluster config -----------------------------------
  - |
    # Create execution queues matching Slurm partitions (debug / compute / long)
    qmgr -c "create queue debug"
    qmgr -c "set queue debug queue_type=execution"
    qmgr -c "set queue debug enabled=True"
    qmgr -c "set queue debug started=True"
    qmgr -c "set queue debug resources_max.ncpus=2"
    qmgr -c "set queue debug resources_max.walltime=00:30:00"

    qmgr -c "create queue compute"
    qmgr -c "set queue compute queue_type=execution"
    qmgr -c "set queue compute enabled=True"
    qmgr -c "set queue compute started=True"
    qmgr -c "set queue compute resources_max.walltime=04:00:00"

    qmgr -c "create queue long"
    qmgr -c "set queue long queue_type=execution"
    qmgr -c "set queue long enabled=True"
    qmgr -c "set queue long started=True"
    qmgr -c "set queue long resources_max.walltime=12:00:00"

    # Set default queue and enable job history
    qmgr -c "set server default_queue=debug"
    qmgr -c "set server job_history_enable=True"
    qmgr -c "set server job_history_duration=720:00:00"

    # Register the ctrl itself as an execution host (local jobs)
    qmgr -c "create node ${ctrlHostname}"
    qmgr -c "set node ${ctrlHostname} queue=debug"

    # Register worker nodes (they register themselves when pbs_mom starts)
    ${qmgrNodeLines}

    echo "PBS queues created:"
    qstat -Q

  # -- 8. pbsdash dashboard (custom Flask, port 5013) ------------------------
  # Note: the upstream pbsweb PyPI package requires SWIG compilation against
  # pbs_ifl.h headers and is not easily installable on Ubuntu 24.04.
  # We use a custom Flask wrapper that achieves the same goal.
  - |
    python3 -m venv /opt/pbsweb-venv
    /opt/pbsweb-venv/bin/pip install --quiet flask

    systemctl daemon-reload
    systemctl enable pbsweb && systemctl start pbsweb
    sleep 5
    systemctl is-active --quiet pbsweb || { journalctl -u pbsweb -n 40 --no-pager; true; }

  # -- 9. Nomad binary + pbs plugin -------------------------------------------
  - |
    cd /tmp
    wget -q https://releases.hashicorp.com/nomad/${nomad_version}/nomad_${nomad_version}_linux_amd64.zip
    unzip -o nomad_${nomad_version}_linux_amd64.zip
    mv nomad /usr/local/bin/ && chmod +x /usr/local/bin/nomad
    rm -f nomad_${nomad_version}_linux_amd64.zip

    mkdir -p /opt/nomad/plugins /etc/nomad.d /opt/nomad/data /etc/nomad.d/secrets
    # Nomad service runs as ubuntu — ensure it can write to its data and plugin dirs.
    chown -R ubuntu:ubuntu /opt/nomad

    # Download the PBS driver plugin.
    # The binary MUST be named "pbs" (Nomad matches plugin "pbs" block by filename).
    if curl -fsSL "${pbsDriverArtifactUrl}" -o /opt/nomad/plugins/pbs 2>/dev/null; then
      chmod +x /opt/nomad/plugins/pbs
      echo "pbs driver downloaded OK"
    else
      echo "WARNING: pbs driver not yet available at ${pbsDriverArtifactUrl} — Nomad will start without PBS driver"
      rm -f /opt/nomad/plugins/pbs
    fi

  # -- 10. Start Nomad -------------------------------------------------------
  - |
    systemctl daemon-reload
    systemctl enable nomad
    systemctl restart nomad

  # -- 11. Smoke checks -------------------------------------------------------
  - |
    sleep 30
    qstat -B && echo "pbs_server OK"
    pbsnodes -a && echo "pbsnodes OK"
    qstat -Q && echo "queues OK"
    echo "Completed"

final_message: "OpenPBS controller ready (build-from-source). pbsdash on :5013, Nomad client node_class=pbs-login joined ${nomad_server_hostname} (gcp-nomadlab datacenter)."
