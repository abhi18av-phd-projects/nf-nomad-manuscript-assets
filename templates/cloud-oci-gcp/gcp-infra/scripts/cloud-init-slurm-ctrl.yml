#cloud-config
output: {all: '| tee -a /var/log/cloud-init-output.log'}
package_upgrade: true
hostname: ${ctrlHostname}
packages:
  - curl
  - wget
  - unzip
  - jq
  - nfs-kernel-server
  - nfs-common
  - munge
  - libmunge-dev
  - slurm-wm
  - slurm-client
  - slurmdbd
  - slurmctld
  - mariadb-server
  - default-jdk-headless
  - rclone
  # Singularity runtime so this head node can pre-pull images into the
  # NFS-shared cache (/shared/singularity-cache) for slurm-w1 to consume.
  - singularity-container

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${publicKey}

write_files:
  - path: /etc/nomad.d/nomad.hcl
    permissions: "0644"
    owner: root:root
    content: |
      datacenter = "gcp-nomadlab"
      data_dir   = "/opt/nomad/data"
      log_level  = "INFO"
      bind_addr  = "0.0.0.0"

      client {
        enabled    = true
        node_class = "slurm-login"
        servers    = ["${nomad_server_hostname}:4647"]

        options {
          "driver.whitelist" = "slurm,raw_exec"
        }

        host_volume "shared" {
          path      = "/shared"
          read_only = false
        }
      }

      acl {
        enabled = true
      }

      plugin_dir = "/opt/nomad/plugins"

      plugin "nomad-driver-slurm" {
        config {
          slurm_conf_path   = ""
          poll_interval     = "10s"
          script_dir        = "/shared/nomad-scripts"
          default_partition = "debug"
        }
      }

      plugin "raw_exec" {
        config {
          enabled = true
        }
      }

  - path: /etc/systemd/system/nomad.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=HashiCorp Nomad
      Documentation=https://www.nomadproject.io/
      Requires=network-online.target munge.service slurmdbd.service slurmctld.service
      After=network-online.target tailscaled.service munge.service slurmdbd.service slurmctld.service

      [Service]
      User=root
      Group=root
      EnvironmentFile=-/etc/nomad.d/secrets/client-token.env
      ExecStartPre=/bin/bash -c 'if [ -f /etc/nomad.d/secrets/client-token.txt ]; then echo "NOMAD_TOKEN=$(cat /etc/nomad.d/secrets/client-token.txt)" > /etc/nomad.d/secrets/client-token.env; fi'
      ExecStartPre=/usr/local/bin/slurm-readiness-check.sh
      ExecStart=/usr/local/bin/nomad agent -config=/etc/nomad.d
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/slurm-readiness-check.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      deadline="$((SECONDS + 120))"
      while (( SECONDS < deadline )); do
        if systemctl is-active --quiet munge && \
           systemctl is-active --quiet slurmdbd && \
           systemctl is-active --quiet slurmctld && \
           ss -ltn | grep -q ':6817' && \
           ss -ltn | grep -q ':6819' && \
           scontrol ping >/dev/null 2>&1; then
          exit 0
        fi
        sleep 3
      done

      echo "slurm readiness check failed before starting nomad" >&2
      systemctl status munge slurmdbd slurmctld --no-pager || true
      journalctl -u slurmdbd -u slurmctld -n 120 --no-pager || true
      ss -ltn || true
      exit 1

runcmd:

  # -- 0. Hostname pinning ---------------------------------------------------
  - |
    grep -q "^127.0.0.1 ${ctrlHostname}$" /etc/hosts || \
      echo "127.0.0.1 ${ctrlHostname}" >> /etc/hosts
    ${workerHostsScript}

  - |
    mkdir -p /shared
    if [ -b /dev/sdb ]; then
      if ! blkid /dev/sdb >/dev/null 2>&1; then
        mkfs.ext4 -F /dev/sdb
      fi
      mount /dev/sdb /shared || true
      if ! grep -q '^/dev/sdb /shared ' /etc/fstab; then
        echo "/dev/sdb /shared ext4 defaults 0 2" >> /etc/fstab
      fi
    fi
    mkdir -p /shared/nomad-scripts /shared/nextflow-work /shared/test-data /shared/results /shared/singularity-cache
    chmod 777 /shared/nomad-scripts /shared/nextflow-work /shared/test-data /shared/results /shared/singularity-cache

  - |
    if ! grep -q '^/shared 10.0.2.0/24' /etc/exports; then
      echo "/shared 10.0.2.0/24(rw,sync,no_subtree_check,no_root_squash)" >> /etc/exports
    fi
    exportfs -ra
    systemctl enable nfs-kernel-server
    systemctl restart nfs-kernel-server

  # Nextflow install + Singularity image prefetch.
  # Placed early (before slurm/nomad bring-up) and made idempotent so a
  # failure in a later runcmd block doesn't leave us without nextflow,
  # which is what we observed on the live abc-dev-slurm-ctrl after its
  # original deploy.
  - |
    if ! command -v nextflow >/dev/null 2>&1; then
      cd /tmp
      curl -fsSL https://get.nextflow.io | bash
      mv nextflow /usr/local/bin/
      chmod +x /usr/local/bin/nextflow
    fi
    nextflow -v || true

    # Pre-pull a small base image so first-time Nextflow runs with
    # `singularity.enabled = true` don't pay a network round-trip.
    # Pipelines may pull additional images on demand.
    mkdir -p /shared/singularity-cache
    chmod 0777 /shared/singularity-cache
    if [ ! -f /shared/singularity-cache/debian-stable-slim.sif ]; then
      ( cd /shared/singularity-cache && singularity pull debian-stable-slim.sif docker://debian:stable-slim ) || \
        echo "WARN: singularity pull failed; pipelines will fall back to lazy fetch"
    fi

  - |
    wget -q https://releases.hashicorp.com/nomad/${nomad_version}/nomad_${nomad_version}_linux_amd64.zip
    unzip -o nomad_${nomad_version}_linux_amd64.zip
    mv nomad /usr/local/bin/
    chmod +x /usr/local/bin/nomad
    rm -f nomad_${nomad_version}_linux_amd64.zip
    mkdir -p /opt/nomad/plugins /etc/nomad.d /opt/nomad/data /etc/nomad.d/secrets
    curl -fsSL ${slurmDriverArtifactUrl} -o /opt/nomad/plugins/nomad-driver-slurm
    chmod +x /opt/nomad/plugins/nomad-driver-slurm

  - |
    curl -fsSL https://tailscale.com/install.sh | sh
    tailscale up --authkey="${tailscaleKey}" --hostname="${tailscaleHostname}" --accept-routes

  - |
    mkdir -p /etc/munge
    echo "${munge_key_b64}" | base64 -d > /etc/munge/munge.key
    chmod 400 /etc/munge/munge.key
    chown munge:munge /etc/munge/munge.key
    systemctl enable munge
    systemctl restart munge
    if ! systemctl is-active --quiet munge; then
      echo "munge failed to start" >&2
      systemctl status munge --no-pager || true
      journalctl -u munge -n 120 --no-pager || true
      exit 1
    fi
    if ! (munge -n | unmunge >/dev/null 2>&1); then
      echo "munge round-trip check failed" >&2
      exit 1
    fi

  - |
    systemctl enable mariadb
    systemctl start mariadb
    if ! systemctl is-active --quiet mariadb; then
      echo "mariadb failed to start" >&2
      systemctl status mariadb --no-pager || true
      journalctl -u mariadb -n 120 --no-pager || true
      exit 1
    fi
    mysql -e "CREATE DATABASE IF NOT EXISTS slurm_acct_db;"
    mysql -e "CREATE USER IF NOT EXISTS 'slurm'@'localhost' IDENTIFIED BY 'slurmpass';"
    mysql -e "GRANT ALL ON slurm_acct_db.* TO 'slurm'@'localhost';"
    mysql -e "FLUSH PRIVILEGES;"

  - |
    cat > /etc/slurm/slurmdbd.conf <<'EOF'
    SlurmUser=slurm
    AuthType=auth/munge
    DbdHost=localhost
    StorageType=accounting_storage/mysql
    StorageHost=localhost
    StorageUser=slurm
    StoragePass=slurmpass
    StorageLoc=slurm_acct_db
    LogFile=/var/log/slurm/slurmdbd.log
    PidFile=/var/run/slurmdbd/slurmdbd.pid
    EOF
    chmod 600 /etc/slurm/slurmdbd.conf
    chown slurm:slurm /etc/slurm/slurmdbd.conf
    mkdir -p /var/log/slurm /var/spool/slurmctld /var/spool/slurmd /var/run/slurmdbd
    chown -R slurm:slurm /var/log/slurm /var/spool/slurmctld /var/spool/slurmd /var/run/slurmdbd
    systemctl enable slurmdbd
    systemctl restart slurmdbd
    slurmdbd_up=0
    for i in {1..40}; do
      if systemctl is-active --quiet slurmdbd && ss -ltn | grep -q ':6819'; then
        slurmdbd_up=1
        break
      fi
      sleep 3
    done
    if [ "${slurmdbd_up}" -ne 1 ]; then
      echo "slurmdbd failed readiness checks" >&2
      systemctl status slurmdbd --no-pager || true
      journalctl -u slurmdbd -n 120 --no-pager || true
      ss -ltn || true
      exit 1
    fi

  - |
    cat > /etc/slurm/slurm.conf <<EOF
    ClusterName=gcp-test
    SlurmctldHost=${ctrlHostname}
    AuthType=auth/munge
    SlurmUser=slurm
    MailProg=/bin/true
    ProctrackType=proctrack/cgroup
    TaskPlugin=task/cgroup,task/affinity
    AccountingStorageType=accounting_storage/slurmdbd
    AccountingStorageHost=localhost
    JobAcctGatherType=jobacct_gather/linux
    SchedulerType=sched/backfill
    SelectType=select/cons_tres
${slurmNodeLines}
    PartitionName=debug   Nodes=${slurmPartitionNodes} Default=YES MaxTime=00:30:00 State=UP
    PartitionName=compute Nodes=${slurmPartitionNodes} MaxTime=04:00:00 State=UP
    PartitionName=tight   Nodes=${slurmPartitionNodes} MaxCPUsPerNode=1 MaxTime=01:00:00 State=UP
    StateSaveLocation=/var/spool/slurmctld
    SlurmdSpoolDir=/var/spool/slurmd
    SlurmctldLogFile=/var/log/slurm/slurmctld.log
    SlurmdLogFile=/var/log/slurm/slurmd.log
    SlurmctldPidFile=/run/slurmctld.pid
    SlurmdPidFile=/run/slurmd.pid
    EOF
    cp /etc/slurm/slurm.conf /etc/slurm/slurm.conf.bootstrap
    cp /etc/slurm/slurm.conf /shared/slurm.conf

  - |
    # Seed accounting objects before starting slurmctld to avoid TRES bootstrap fatal errors.
    sacctmgr -i add cluster gcp-test || true
    sacctmgr -i add account testaccount cluster=gcp-test description="Test account" || true
    sacctmgr -i add user slurm account=testaccount cluster=gcp-test || true
    sacctmgr -i add qos debug_qos MaxWall=00:30:00 MaxJobsPerUser=5 || true
    sacctmgr -i modify partition debug set qos=debug_qos || true

  - |
    systemctl enable slurmctld
    systemctl restart slurmctld
    slurmctld_up=0
    for i in {1..40}; do
      if systemctl is-active --quiet slurmctld && ss -ltn | grep -q ':6817'; then
        slurmctld_up=1
        break
      fi
      sleep 3
    done
    if [ "${slurmctld_up}" -ne 1 ]; then
      echo "slurmctld failed readiness checks" >&2
      systemctl status slurmctld --no-pager || true
      journalctl -u slurmctld -u slurmdbd -n 160 --no-pager || true
      ss -ltn || true
      exit 1
    fi
    if ! scontrol show reservation testreservation >/dev/null 2>&1; then
      scontrol create reservation reservationname=testreservation starttime=now duration=02:00:00 nodecnt=1 flags=ignore_jobs user=slurm
    fi
    if ! scontrol ping >/dev/null 2>&1; then
      echo "scontrol ping failed after slurmctld startup" >&2
      systemctl status slurmctld --no-pager || true
      journalctl -u slurmctld -n 120 --no-pager || true
      exit 1
    fi

  - |
    systemctl daemon-reload
    systemctl enable nomad
    systemctl restart nomad

  # Nextflow install moved earlier (right after NFS setup) so it doesn't
  # depend on slurm/nomad being healthy. See note above.

  - |
    sleep 60
    munge -n | unmunge >/dev/null
    echo "munge OK on ctrl"
    sinfo >/dev/null
    echo "sinfo OK"
    sbatch --wrap "hostname" --partition debug >/dev/null
    echo "sbatch OK"
    echo "Completed"

final_message: "Slurm controller configured!"
