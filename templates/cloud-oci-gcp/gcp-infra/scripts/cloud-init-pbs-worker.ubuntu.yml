#cloud-config
# OpenPBS worker — build-from-source mode (ubuntu image variant).
# Builds OpenPBS pbs_mom + pbs_comm, mounts NFS from ctrl, and registers
# with the PBS server so it appears in pbsnodes.
#
# Template variables:
#   ${publicKey}           SSH public key for ubuntu user
#   ${ctrlIp}              Internal IP of the PBS ctrl (10.0.2.50)
#   ${ctrlHostname}        Hostname of the PBS ctrl (e.g. abc-dev-pbs-ctrl)
#   ${nodeName}            This worker's hostname (e.g. abc-dev-pbs-w1)
# Note: workers do NOT join Tailscale — internal GCP IP only.
output: {all: '| tee -a /var/log/cloud-init-output.log'}
hostname: ${nodeName}

packages:
  - nfs-common
  - curl
  - wget
  # OpenPBS build dependencies (same as ctrl)
  - autoconf
  - automake
  - libtool
  - make
  - gcc
  - g++
  - libssl-dev
  - libexpat1-dev
  - libedit-dev
  - libical-dev
  - libhwloc-dev
  - hwloc
  - libpq-dev
  - libsystemd-dev
  - tcl-dev
  - tk-dev
  - python3-dev
  - python3-setuptools
  - swig
  # X11 dev headers required by OpenPBS build on Ubuntu 24.04
  - libxt-dev
  - libxext-dev
  - libsm-dev
  - libice-dev
  - libxmu-dev
  - x11-common
  # Python 3.11 PPA tools (python3.11 installed via add-apt-repository in runcmd)
  - software-properties-common

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${publicKey}

runcmd:

  # -- 0. Hostname pinning (before Tailscale joins) --------------------------
  # Pin ctrlHostname to its internal IP so Tailscale MagicDNS can never
  # redirect pbs_mom → pbs_server connections to a stale offline device.
  # Worker's own hostname may stay on 127.0.0.1 (pbs_mom binds to its
  # interface, not to the loopback; PBS server resolves the worker IP via
  # the ctrl's /etc/hosts entry added there during ctrl cloud-init).
  - |
    grep -q "^${ctrlIp} ${ctrlHostname}$" /etc/hosts || \
      printf '%s %s\n' "${ctrlIp}" "${ctrlHostname}" >> /etc/hosts
    grep -q "^127.0.0.1 ${nodeName}$" /etc/hosts || \
      printf '127.0.0.1 %s\n' "${nodeName}" >> /etc/hosts

  # -- 1. NFS mount from ctrl ------------------------------------------------
  - |
    mkdir -p /shared
    grep -q "^${ctrlIp}:/shared /shared nfs" /etc/fstab || \
      echo "${ctrlIp}:/shared /shared nfs defaults,_netdev 0 0" >> /etc/fstab
    mount -a || true

  # -- 3. Build OpenPBS 23.06.06 from source ---------------------------------
  # Ubuntu 24.04 ships Python 3.12 which removed eval.h from public headers.
  # Install Python 3.11 from deadsnakes PPA and use it as the build interpreter.
  - |
    export DEBIAN_FRONTEND=noninteractive
    PBS_VERSION="23.06.06"
    PBS_URL="https://github.com/openpbs/openpbs/archive/refs/tags/v${PBS_VERSION}.tar.gz"

    # Python 3.11 from deadsnakes (Python 3.12 removed eval.h from public headers)
    add-apt-repository -y ppa:deadsnakes/ppa
    apt-get update -qq
    apt-get install -y python3.11 python3.11-dev

    cd /tmp
    wget --no-verbose "$PBS_URL" -O openpbs.tar.gz || { echo "ERROR: failed to download OpenPBS $PBS_VERSION"; exit 1; }
    tar xzf openpbs.tar.gz
    cd openpbs-${PBS_VERSION}

    # Patch: Python 3.12 removed eval.h; replace with the renamed header ceval.h
    grep -rl '#include <eval.h>' src/ | xargs -r sed -i 's|#include <eval.h>|#include <ceval.h>|g'

    ./autogen.sh
    PYTHON=/usr/bin/python3.11 ./configure \
      --prefix=/usr/local \
      --with-pbs-server-home=/var/spool/pbs \
      --with-database-name=pbs \
      --with-database-user=pbs \
      --with-database-port=5432
    make -j$(nproc)
    make install

    /usr/local/libexec/pbs_postinstall

    # Register shared library path so libpbs.so.0 is found by qstat/qsub etc.
    echo "/usr/local/lib" > /etc/ld.so.conf.d/usr-local.conf
    ldconfig

    # pbs_iff must be SUID root so non-root users can run qstat/qsub
    chmod 4755 /usr/local/sbin/pbs_iff

    echo "OpenPBS ${PBS_VERSION} installed on worker"

  # -- 4. Configure pbs_mom + pbs_comm as execution-only host ---------------
  # OpenPBS 23 uses TPP (Tree-based Peer Protocol) which requires pbs_comm
  # as a relay daemon on every node, including workers. Without pbs_comm the
  # mom cannot communicate with the server and the node stays state-unknown.
  - |
    sed -i \
      -e 's/PBS_START_SERVER=0/PBS_START_SERVER=0/' \
      -e 's/PBS_START_SCHED=0/PBS_START_SCHED=0/' \
      /etc/pbs.conf

    # Enable mom + comm on worker
    sed -i 's/PBS_START_MOM=0/PBS_START_MOM=1/' /etc/pbs.conf
    sed -i 's/PBS_START_COMM=0/PBS_START_COMM=1/' /etc/pbs.conf

    # Point mom at the PBS server
    sed -i "s/PBS_SERVER=.*/PBS_SERVER=${ctrlHostname}/" /etc/pbs.conf

    # Configure $usecp so PBS mom uses NFS (cp) instead of SCP for output staging.
    # Without this, PBS tries to SSH back to the ctrl to deliver output files, but
    # 10.0.2.x port 22 may be unreachable from the worker. Since /shared is NFS-
    # mounted on all nodes, local cp is both faster and more reliable.
    mkdir -p /var/spool/pbs/mom_priv
    # Match both short hostname and any FQDN form of ctrl
    echo "\$usecp ${ctrlHostname}:/shared /shared" >> /var/spool/pbs/mom_priv/config
    echo "\$usecp *:/shared /shared" >> /var/spool/pbs/mom_priv/config

    echo "PBS worker configured → PBS_SERVER=${ctrlHostname}, PBS_START_COMM=1, usecp NFS"

  # -- 5. Start pbs_mom + pbs_comm -------------------------------------------
  - |
    systemctl enable pbs
    systemctl start pbs
    for i in $(seq 1 30); do
      systemctl is-active --quiet pbs && break
      sleep 5
    done
    systemctl is-active --quiet pbs || { journalctl -u pbs -n 80 --no-pager; exit 1; }
    echo "pbs_mom active"

  - echo "Completed"

final_message: "OpenPBS worker (pbs_mom + pbs_comm) ready. Registered with PBS_SERVER=${ctrlHostname}."
